<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>People Search</title>

    <link rel="stylesheet" href="App.css">
</head>
<body>

    <div class="container">

        <h1>Search People</h1>

        <!-- Search Area -->
        <div class="search-box">
            <input type="text" placeholder="Search people...">
            <button>Search</button>
        </div>

        <!-- People Cards -->
        <div class="people-container">

            <!-- Person 1 -->
            <div class="person-card">
                <img src="https://i.pravatar.cc/150?img=12" alt="Rahul Sharma">

                <div class="person-info">
                    <h2>Rahul Sharma</h2>
                    <p class="username">@rahulsharma</p>
                    <p>Web Developer</p>
                    <p>Mumbai, India</p>

                    <button class="profile-btn">
                        View Profile
                    </button>
                </div>
            </div>


            <!-- Person 2 -->
            <div class="person-card">
                <img src="https://i.pravatar.cc/150?img=32" alt="Amit Kumar">

                <div class="person-info">
                    <h2>Amit Kumar</h2>
                    <p class="username">@amitkumar</p>
                    <p>UI/UX Designer</p>
                    <p>Delhi, India</p>

                    <button class="profile-btn">
                        View Profile
                    </button>
                </div>
            </div>


            <!-- Person 3 -->
            <div class="person-card">
                <img src="https://i.pravatar.cc/150?img=47" alt="Priya Singh">

                <div class="person-info">
                    <h2>Priya Singh</h2>
                    <p class="username">@priyasingh</p>
                    <p>Software Engineer</p>
                    <p>Pune, India</p>

                    <button class="profile-btn">
                        View Profile
                    </button>
                </div>
            </div>


            <!-- Person 4 -->
            <div class="person-card">
                <img src="https://i.pravatar.cc/150?img=68" alt="Neha Patel">

                <div class="person-info">
                    <h2>Neha Patel</h2>
                    <p class="username">@nehapatel</p>
                    <p>Graphic Designer</p>
                    <p>Ahmedabad, India</p>

                    <button class="profile-btn">
                        View Profile
                    </button>
                </div>
            </div>

        </div>

    </div>
 <script src="App.js"></script>
</body>
</html>
